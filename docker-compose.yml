services:
  fluxity-interface:
    build:
      context: .
    image: fluxity-interface:latest
    container_name: fluxity-interface
    restart: unless-stopped
    ports:
      - '3001:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
