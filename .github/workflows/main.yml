name: FluxityInterface
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

jobs:
  Verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  Build:
    name: Build
    runs-on: self-hosted
    needs: ['Verify']
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fluxity-interface:latest .

  Execute:
    name: Execute
    runs-on: self-hosted
    needs: ['Build']
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker compose down
          docker compose up -d

  Cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: ['Build', 'Execute']
    if: github.event_name == 'push'
    steps:
      - name: Prune unused images
        run: |
          docker container prune -f
          docker image prune -af
